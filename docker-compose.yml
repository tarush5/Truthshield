name: truthshield

# The full stack. `docker compose up` gives you Postgres, Redis, the API, a
# Celery worker and the web app, with migrations applied before the API
# accepts traffic.
#
# The API and worker deliberately share one image and one dependency set: a
# worker running different code than the API is a failure mode that only
# shows up in production.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: truthshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truthshield}
      POSTGRES_DB: truthshield
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Dependent services wait for this, so the API does not start against a
      # database that is still initialising and then crash-loop.
      test: ["CMD-SHELL", "pg_isready -U truthshield -d truthshield"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persist the queue: an unsaved Redis loses every queued analysis on restart.
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment: &backend_env
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://truthshield:${POSTGRES_PASSWORD:-truthshield}@db:5432/truthshield
      REDIS_URL: redis://redis:6379/0
      # No default. The app refuses to start in production without a real one,
      # which is the point — a shipped default key is a published signing key.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY, e.g. python -c "import secrets; print(secrets.token_hex(32))"}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENABLE_ML_DETECTORS: ${ENABLE_ML_DETECTORS:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_FACTCHECK_API_KEY: ${GOOGLE_FACTCHECK_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn truthshield.main:app --host 0.0.0.0 --port 8000
    environment: *backend_env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # Analysis is I/O-bound with bursts of CPU, so threads beat processes here
    # and keep memory down when the ML extras are installed.
    command: celery -A truthshield.infra.celery_app.celery_app worker --loglevel=info --concurrency=4 --pool=threads
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
